const cases=[{"url": "https://lawlex.ir/rulings/ruling-40220", "text": "موضوع دستور موقت، مکانیسمی جدای از موضوع درخواست قرار توقف منع اجرا است چه اینکه قانونگذار طی مواد ۳۱۰ به بعد قانون ایین دادرسی دادگاههای عمومی و انقلاب در امور مدنی ، موضوع دستور موقت را مطرح و همین مقنن طی ماده ۴۹۳ این قانون در بحث داوری مکانیسم توقف منع اجرا را پیش بینی می نمایند لذا با وحدت ملاک از ماده ۲ همین قانون ، قرار رد درخواست دستور موقت منع اجرای رای داور موصوف را صادر و اعلام می دارد.", "meta": "شعبه ۸۶ دادگاه عمومی حقوقی مجتمع قضایی شهید صدر تهران · ۱۴۰۲/۰۶/۰۶"}, {"url": "https://lawlex.ir/rulings/ruling-39426", "text": "در دستور موقت مبنی بر تحویل فرزندان مشترک،نتیجه دستور موقت نباید نتیجه دعوای اصلی باشد.", "meta": "شعبه ۳ دادگاه عمومی حقوقی شهرستان بندر ماهشهر · ۱۴۰۲/۰۴/۱۰"}, {"url": "https://lawlex.ir/rulings/ruling-36118", "text": "قرار رد دادخواست تأمین خواسته قابل تجدیدنظرخواهی است. و ۱ رأی دیگر با همین نکته", "meta": "شعبه اول دیوان عالی کشور · ۱۴۰۱/۰۴/۲۱"}, {"url": "https://lawlex.ir/rulings/ruling-36078", "text": "دستور توقف عملیات اجرایی قطعی و غیرقابل تجدیدنظر می باشد.", "meta": "شعبه دوازدهم دیوان عالی کشور · ۱۴۰۱/۰۳/۳۱"}, {"url": "https://lawlex.ir/rulings/ruling-36291", "text": "درخواست تامین در صورتی پذیرفته می شود که میزان خواسته معلوم یا عین معین باشد؛ بنابراین درخواست صدور قرار تأمین خواسته در دعوای الزام به ایفای تعهد(الزام به مقدمات و تنظیم سند رسمی) قابل پذیرش نیست. و ۱ رأی دیگر با همین نکته", "meta": "۱۴۰۱/۰۲/۳۱"}, {"url": "https://lawlex.ir/rulings/ruling-36002", "text": "دعوای درخواست تامین خواسته در صلاحیت دادگاهی است که صلاحیت رسیدگی به دعوا را دارد. بنابراین در دعوای مطالبه چک که دارنده چک می تواند تخییرا به دادگاه محل وقوع قرارداد ( محل صدور چک ) یا دادگاه محل انجام تعهد ( محل استقرار بانک محال علیه ) و یا به دادگاه محل اقامت خوانده مراجعه کند، تامین خواسته نیز قابل طرح در هر یک از این دادگاهها است و با مراجعه به هریک از دادگاه های مزبور برای آن محکمه ایجاد صلاحیت خواهد شد.", "meta": "شعبه دوازدهم دیوان عالی کشور · ۱۴۰۱/۰۲/۳۱"}, {"url": "https://lawlex. ass="chips">${p?link('جستجوی موضوعی در لالکس',search(i.t,'lawlex.ir/'+p))+link('فهرست لالکس',root+'/'+p):j===7?link('جستجو در SID',search(i.t,'sid.ir'))+link('جستجو در نورمگز',search(i.t,'noormags.ir')):''}${j===5?((d||[]).map(n=>link(n===17?'دستور موقت و تأمین خواسته — مجموعه مشترک لالکس':'مجموعه موضوعی '+fa(n),root+'/nokat/a09-'+String(n).padStart(2,'0'))).join('')+link('جستجو در آرای پژوهشگاه',search(i.t,'ara.jri.ac.ir'))):''}${j===4?link('جستجو در ویکی‌حقوق',search(i.t,'wikihoghoogh.net')):''}</div><small>پیوندها تأیید زنده نشده‌اند؛ نتیجه جستجو نیازمند بررسی است.</small>${j===5&&['دستور موقت','تأمین خواسته'].includes(i.t)?`<details><summary>آرای مجموعه مشترک دستور موقت و تأمین خواسته — لالکس</summary><p class="muted">ارتباط دقیق هر رأی و متن اصلی نیازمند بررسی است.</p>${cases.map(c=>`<div class="case"><p>${esc(c.text)}</p><small>${esc(c.meta)}</small><br>${link('متن رأی در لالکس',c.url)}</div>`).join('')}</details>`:''}`}

function law(i,h){let titles={'آیین دادرسی مدنی':'قانون آیین دادرسی مدنی','حقوق مدنی':'قانون مدنی','حقوق تجارت':'قانون تجارت','حقوق جزای عمومی':'قانون مجازات اسلامی','حقوق جزای اختصاصی':'قانون مجازات اسلامی تعزیرات','آیین دادرسی کیفری':'قانون آیین دادرسی کیفری','حقوق ثبت':'قانون ثبت اسناد و املاک','اجرای احکام':'قانون اجرای احکام مدنی'},title=titles[i.g];return `<div class="source-row">${link('سامانه ملی قوانین','https://qavanin.ir')}${link('متن قانون در لالکس',root+'/laws/'+known[i.g])}${wikiTopic(title+' '+i.t)}</div>${h?`<p><b>مواد پیشنهادی: ${esc(h[0])}</b></p><details open><summary>دسترسی به مواد از سه مسیر</summary>${nums(h[0]).map(n=>`<div class="source-row"><b>ماده ${fa(n)}</b>${link('لالکس',root+'/laws/aeen-madani/'+n)}${link('ویکی‌حقوق (آزمایشی)',wikiRoot+'/wiki/'+encodeURIComponent('ماده_'+fa(n).replace(/٬/g,'')+'_قانون_آیین_دادرسی_مدنی'))}${link('گوگل',search('ماده '+n+' '+title))}</div>`).join('')}</details>`:'<p class="source-help">مواد اختصاصی هنوز تدوین نشده‌اند.</p>'}${i.t==='ادله اثبات دعوا'?link('ماده ۱۲۵۷ قانون مدنی',root+'/laws/madani/1257')+link('ماده ۱۲۵۷ در ویکی‌حقوق (آزمایشی)',wikiRoot+'/wiki/'+encodeURIComponent('ماده_۱۲۵۷_قانون_مدنی'))+link('گوگل: ماده ۱۲۵۷',search('ماده 1257 قانون مدنی')):''}<p class="source-help">پیوندهای مستقیم ویکی‌حقوق آزمایش زنده نشده‌اند؛ در صورت خطا از گوگل استفاده کنید. متن رسمی را پیش از استناد بررسی کنید.</p>`}function backup(){let a=document.createElement('a');let u=URL.createObjectURL(new Blob([JSON.stringify(db,null,2)],{type:'application/json'}));a.href=u;a.download='ATABAK-v10-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}function settings(){return `<section class="panel"><h1>مدیریت اطلاعات</h1><p>اطلاعات محلی ذخیره می‌شوند و پس از ورود به حساب، با فضای ابری همگام می‌شوند. فایل پشتیبان حاوی یادداشت‌های شخصی است؛ آن را محرمانه نگه دارید.</p><div class="row"><button class="primary" onclick="backup()">دریافت پشتیبان</button><button onclick="$('#file').click()">بازیابی / ادغام پشتیبان</button></div><p class="muted">پشتیبان نسخه‌های قبلی قابل انتقال است. در ادغام، رکورد موجود حفظ می‌شود و تنها رکوردهای جدید افزوده می‌شوند. برای جایگزینی کامل، ابتدا از اطلاعات فعلی پشتیبان بگیرید.</p></section>`}$('#file').onchange=async()=>{try{let x=migrate(JSON.parse(await $('#file').files[0].text()));let conflicts=Object.keys(x.records).filter(k=>db.records[k]).length;if(confirm('ادغام پشتیبان؟ '+fa(conflicts)+' رکورد مشترک بدون تغییر حفظ می‌شود.')){db.records={...x.records,...db.records};db.last=db.last||x.last;save();render()}else if(confirm('جایگزینی کامل اطلاعات؟ ابتدا پشتیبان فعلی دانلود می‌شود.')){backup();db=x;save();render()}}catch(e){alert('بازیابی ناموفق: '+e.message)}$('#file').value=''};let mindZoom=100;let mindOpen=new Set();function toggleMind(g){mindOpen.has(g)?mindOpen.delete(g):mindOpen.add(g);render()}function mindScale(v){mindZoom=Math.max(75,Math.min(150,mindZoom+v));let el=$('#mindcanvas');if(el)el.style.zoom=mindZoom/100;let z=$('#mindzoom');if(z)z.textContent=fa(mindZoom)+'٪'}function mind(){return `<section class="panel"><h1>نقشه دانش حقوقی</h1><p class="muted">هر حوزه را باز کنید؛ رنگ هر مبحث از پیشرفت واقعی شما می‌آید. روی مبحث بزنید تا صفحه مطالعه باز شود.</p><div class="row" style="flex-wrap:wrap"><button onclick="mindOpen=new Set(Object.keys(groups));render()">باز کردن همه</button><button onclick="mindOpen.clear();render()">بستن همه</button><button onclick="mindScale(-10)">−</button><span id="mindzoom">${fa(mindZoom)}٪</span><button onclick="mindScale(10)">+</button></div><div class="mindlegend">${labels.map((t,j)=>`<span><i style="background:${colors[j]}"></i><small>${t}</small></span>`).join('')}</div><div class="mindboard"><div class="mindcanvas" id="mindcanvas" style="zoom:${mindZoom/100}"><div class="mindroot">⚖ اتابک | دانش حقوقی</div><div class="mindstem"></div><div class="mindgrid">${Object.keys(groups).map(g=>{let a=items.filter(i=>i.g===g),o=mindOpen.has(g);return `<div class="mindbranch"><button aria-expanded="${o}" onclick="toggleMind('${g}')">${g} ${o?'−':'+'}</button>${bar(average(a))}<small>${fa(average(a))}٪ · ${fa(a.length)} مبحث</small>${o?`<div class="mindnodes">${a.map(i=>{let r=get(i),st=status(r);return `<button class="mindnode" style="--state:${colors[st]}" onclick="openTopic('${i.id}')"><span class="dot" style="background:${colors[st]}">${st===3?'✓':'•'}</span><span class="grow">${esc(i.t)}<br><small>${labels[st]}</small></span><b>${fa(pct(r))}٪</b></button>`}).join('')}</div>`:''}</div>`}).join('')}</div></div></div></section>`}function render(){$('#nav').innerHTML=[['home','⌂ صفحه اصلی'],['map','▤ نقشه مطالعاتی'],['mind','◇ نقشه دانش حقوقی'],['settings','⚙ مدیریت اطلاعات']].map(([p,t])=>`<button class="${page===p||(p==='map'&&page==='topic')?'active':''}" onclick="go('${p}')">${t}</button>`).join('');$('#app').innerHTML=page==='home'?home():page==='map'?map():page==='topic'?topic():page==='mind'?mind():cloudPanel()+settings();if(page==='map')results()}
const cloudURL='https://xnfqrtopasuttkmhwxgm.supabase.co',cloudKey='sb_publishable_uEHlnyHLzA6D9SsfCN6Drw_fNGi6pai';
let session=null,busy=false,timer,cloudBase=null,cloudStamp=null,cloudMessage='وارد حساب شوید',blocked=false;
function cloudStatus(t){cloudMessage=t;let e=document.getElementById('cloudstatus');if(e)e.textContent=t}
function cloudPanel(){return `<section class="panel" style="margin-bottom:12px"><h2>همگام‌سازی اتابک</h2><p id="cloudstatus" aria-live="polite">${esc(cloudMessage)}</p>${session?'<div class="row"><button onclick="syncNow()">همگام‌سازی اکنون</button><button onclick="cloudLogout()">خروج</button></div>':'<form onsubmit="event.preventDefault();cloudLogin()"><input id="cloudemail" type="email" placeholder="ایمیل" required autocomplete="username"><input id="cloudpass" type="password" placeholder="رمز ورود اتابک" required autocomplete="current-password"><button class="primary">ورود</button></form>'}</section>`}
async function request(path,options={},auth=false){let r=await fetch(cloudURL+path,{...options,headers:{apikey:cloudKey,'Content-Type':'application/json',...(auth?{Authorization:'Bearer '+session.access_token}:{}),...options.headers}});let t=await r.text();if(!r.ok)throw Error('خطای اتصال '+r.status);return t?JSON.parse(t):null}
function storeSession(s){session=s;localStorage.setItem('atabak-cloud-session',JSON.stringify(s))}
async function refreshSession(){if(!session)throw Error('ابتدا وارد شوید');if(session.expires_at*1000>Date.now()+60000)return;let s=await request('/auth/v1/token?grant_type=refresh_token',{method:'POST',body:JSON.stringify({refresh_token:session.refresh_token})});storeSession(s)}
async function cloudLogin(){if(busy)return;busy=true;try{let email=$('#cloudemail').value,password=$('#cloudpass').value;let s=await request('/auth/v1/token?grant_type=password',{method:'POST',body:JSON.stringify({email,password})});storeSession(s);cloudBase=null;blocked=false;render()}catch(e){cloudStatus('ورود ناموفق؛ ایمیل، رمز و اینترنت را بررسی کنید.')}finally{busy=false}if(session)syncNow()}
function cloudLogout(){if(busy)return;if(!confirm('خروج از حساب؟ اطلاعات محلی باقی می‌ماند.'))return;session=null;cloudBase=null;blocked=false;localStorage.removeItem('atabak-cloud-session');cloudStatus('خارج شده‌اید');render()}
const same=(a,b)=>JSON.stringify(a)===JSON.stringify(b);
function mergeCloud(base,local,remote){let result={version:5,records:{},last:local.last||remote.last};for(let k of new Set([...Object.keys(base?.records||{}),...Object.keys(local.records),...Object.keys(remote.records)])){let b=base?.records[k],l=local.records[k],r=remote.records[k],v;if(same(l,r))v=l;else if(base&&same(l,b))v=r;else if(base&&same(r,b))v=l;else if(!base&&!l)v=r;else if(!base&&!r)v=l;else {if(!confirm('تغییر متفاوت در مبحث '+(items.find(i=>i.id===k)?.t||k)+'؛ تأیید = نسخه این دستگاه، لغو = نسخه ابری. قبل از انتخاب، پشتیبان محلی دانلود می‌شود.'))v=r;else v=l;}if(v)result.records[k]=v}return result}
async function syncNow(){if(!session||busy)return;busy=true;cloudStatus('در حال همگام‌سازی…');try{await refreshSession();let id=session.user.id,filter='/rest/v1/atabak_data?user_id=eq.'+encodeURIComponent(id),rows=await request(filter+'&select=data,updated_at',{},true),row=rows[0],remote=row?migrate(row.data):null;let local=migrate(db),base=cloudBase;if(!base){try{let saved=JSON.parse(localStorage.getItem('atabak-cloud-base-'+id)||'null');if(saved)base=migrate(saved)}catch(e){}}if(remote&&!same(local,remote)&&(!base||(!same(local,base)&&!same(remote,base))))backup();let merged=remote?mergeCloud(base,local,remote):local;if(!same(db,local)){cloudStatus('تغییر جدید؛ تلاش مجدد');return}if(!remote||!same(merged,remote)){let stamp=new Date().toISOString();let payload={user_id:id,data:merged,updated_at:stamp};let result=await request(row?filter+'&updated_at=eq.'+encodeURIComponent(row.updated_at):'/rest/v1/atabak_data',{method:row?'PATCH':'POST',headers:{Prefer:'return=representation'},body:JSON.stringify(payload)},true);if(!result?.length)throw Error('تغییر همزمان؛ دوباره تلاش کنید')}cloudBase=merged;localStorage.setItem('atabak-cloud-base-'+id,JSON.stringify(merged));if(same(db,local)&&!same(db,merged)){db=merged;localStorage.setItem(key,JSON.stringify(db));if(!['TEXTAREA','INPUT'].includes(document.activeElement?.tagName))render()}cloudStatus('همگام شد · '+new Date().toLocaleTimeString('fa-IR'));}catch(e){cloudStatus('همگام‌سازی ناموفق؛ اطلاعات محلی محفوظ است. '+e.message)}finally{busy=false}}
function queueCloud(){clearTimeout(timer);if(session)timer=setTimeout(syncNow,1200)}
try{session=JSON.parse(localStorage.getItem('atabak-cloud-session')||'null')}catch(e){}render();if(session)syncNow();setInterval(()=>{if(session&&document.visibilityState==='visible'&&!['TEXTAREA','INPUT'].includes(document.activeElement?.tagName))syncNow()},30000);window.addEventListener('online',syncNow);window.addEventListener('focus',()=>{if(session)syncNow()});

</script></html>
